<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>
    <link rel="icon" href="https://i.imgur.com/ApFJxSE.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="container mx-auto">
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8 flex justify-between">
            <h1 class="text-3xl font-bold text-gray-800">Gestor</h1>
            <nav class="flex gap-4">
                <a href="{{ url_for('main.index') }}" class="text-blue-600 font-bold">Inicio</a>
            </nav>
        </div>
        {% if mensaje %}
        <div class="bg-green-100 border-l-4 border-green-500 text-green-700 p-4 rounded-xl mb-6 shadow-md">{{ mensaje }}</div>
        {% endif %}
        <div class="bg-white rounded-2xl shadow-xl p-6">
            <form method="POST" class="space-y-6">
                <div class="space-y-4">
                    <h3 class="text-xl font-semibold text-gray-700">Familias</h3>
                    {% for f in familias %}
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Familia {{ loop.index }}:</label>
                        <input type="text" name="familia_nombre_{{ f.id }}" value="{{ f.nombre }}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-xl py-2 px-3 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    {% endfor %}
                </div>
                <hr class="my-6 border-gray-200">
                <div class="space-y-4">
                    <h3 class="text-xl font-semibold text-gray-700">Costos Base</h3>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Costo kWh:</label>
                        <input type="number" step="0.0001" name="costo_kwh" value="{{ config.costo_kwh }}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-xl py-2 px-3 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Costo m3:</label>
                        <input type="number" step="0.0001" name="costo_m3" value="{{ config.costo_m3 }}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-xl py-2 px-3 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">IGV (%):</label>
                        <input type="number" step="0.01" name="igv_porcentaje" value="{{ config.igv_porcentaje }}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-xl py-2 px-3 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="inline-flex items-center px-6 py-3 border border-transparent text-sm font-medium rounded-xl shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300 transform hover:scale-105">Guardar Configuración</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
