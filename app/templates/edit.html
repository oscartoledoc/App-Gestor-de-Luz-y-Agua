<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar</title>
    <link rel="icon" href="https://i.imgur.com/ApFJxSE.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
    <div class="container mx-auto">
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-8 flex justify-between">
            <h1 class="text-3xl font-bold text-gray-800">Gestor</h1>
            <nav class="flex gap-4">
                <a href="{{ url_for('main.index') }}" class="text-blue-600 font-bold">Inicio</a>
            </nav>
        </div>
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-8">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">Editar Consumo</h2>
            <form action="{{ url_for('main.actualizar_consumo', cid=consumo.id) }}" method="POST" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Familia</label>
                    <select name="familia" class="w-full border rounded-lg p-2">
                        {% for f in familias %}
                        <option value="{{ f.id }}" {% if consumo.familia_id == f.id %}selected{% endif %}>{{ f.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Servicio</label>
                    <select name="servicio" class="w-full border rounded-lg p-2">
                        <option value="Luz" {% if consumo.servicio == 'Luz' %}selected{% endif %}>Luz</option>
                        <option value="Agua" {% if consumo.servicio == 'Agua' %}selected{% endif %}>Agua</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Fecha</label>
                    <input type="date" name="fecha" value="{{ consumo.fecha }}" class="w-full border rounded-lg p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Lectura</label>
                    <input type="number" step="0.01" name="lectura" value="{{ consumo.lectura }}" class="w-full border rounded-lg p-2">
                </div>
                
                <hr class="my-4 border-gray-200">
                
                <h3 class="text-sm font-bold text-gray-700 mb-3">Costos Fijos Luz (Total Recibo)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-600">Cargo Fijo</label>
                        <input type="number" step="0.01" name="luz_cargo_fijo" value="{{ consumo.luz_cargo_fijo|default(0) }}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-xl py-2 px-3">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">Mant.</label>
                        <input type="number" step="0.01" name="luz_mantenimiento" value="{{ consumo.luz_mantenimiento|default(0) }}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-xl py-2 px-3">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">Alumbrado</label>
                        <input type="number" step="0.01" name="luz_alumbrado" value="{{ consumo.luz_alumbrado|default(0) }}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-xl py-2 px-3">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">Interés</label>
                        <input type="number" step="0.01" name="luz_interes" value="{{ consumo.luz_interes|default(0) }}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-xl py-2 px-3">
                    </div>
                </div>
                
                <hr class="my-4 border-gray-200">
                
                <h3 class="text-sm font-bold text-gray-700 mb-3">Costos Fijos Agua (Total Recibo)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs text-gray-600">Alcantarillado</label>
                        <input type="number" step="0.01" name="agua_alcantarillado" value="{{ consumo.agua_alcantarillado|default(0) }}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-xl py-2 px-3">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">Cargo Fijo</label>
                        <input type="number" step="0.01" name="agua_cargo_fijo" value="{{ consumo.agua_cargo_fijo|default(0) }}" class="mt-1 block w-full shadow-sm sm:text-sm border-gray-300 rounded-xl py-2 px-3">
                    </div>
                </div>
                
                <div class="flex justify-end gap-2 mt-6">
                    <a href="{{ url_for('main.index') }}" class="px-4 py-2 border rounded-lg text-gray-700 hover:bg-gray-50">Cancelar</a>
                    <button class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
